# Local MySQL for this copy. Does not import the Aiven credentials/profile.
spring.config.import=optional:file:../.env.community[.properties],optional:file:./.env.community[.properties]
server.address=127.0.0.1
server.port=8081
community.enabled=true
spring.datasource.url=jdbc:mysql://${COMMUNITY_DB_HOST:127.0.0.1}:${COMMUNITY_DB_PORT:3306}/${COMMUNITY_DB_NAME:remind_community_dev}?createDatabaseIfNotExist=true&connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${COMMUNITY_DB_USERNAME}
spring.datasource.password=${COMMUNITY_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.devtools.restart.enabled=false
