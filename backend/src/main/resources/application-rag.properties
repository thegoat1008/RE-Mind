# Activate together with an existing DB profile, e.g. dev,rag or community-mysql,rag.
# No datasource, JPA DDL mode, server port or community settings are overridden here.
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties],optional:file:./.env.rag[.properties]
rag.gemini.api-key=${GEMINI_API_KEY:}
rag.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
rag.public-data.service-key=${PUBLIC_DATA_SERVICE_KEY:}
rag.schema.initialize=${RAG_SCHEMA_INITIALIZE:false}
rag.allowed-origins=${RAG_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
rag.import.source=${RAG_IMPORT_SOURCE:welfare}
rag.import.query=${RAG_IMPORT_QUERY:\uCE58\uB9E4}
rag.import.sido-code=${RAG_IMPORT_SIDO_CODE:}
rag.import.max-pages=${RAG_IMPORT_MAX_PAGES:1}
rag.import.max-details=${RAG_IMPORT_MAX_DETAILS:10}
