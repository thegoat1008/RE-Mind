# Local, anonymous MVP sandbox. Do not expose on a public network.
server.address=127.0.0.1
server.servlet.session.cookie.name=REMIND_ONI_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=30m
spring.datasource.url=jdbc:h2:mem:oni;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=false
oni.ai.provider=${ONI_AI_PROVIDER:demo}
oni.ai.api-key=${GEMINI_API_KEY:}
oni.ai.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
oni.ai.timeout-seconds=25
