# MySQL connection for AI development. DB_HOST must be supplied; no default local server.
# Existing Aiven dev/prod TLS settings are independent from this profile.
server.address=127.0.0.1
server.port=8083
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?sslMode=PREFERRED&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul&connectTimeout=5000&socketTimeout=15000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=10000
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.devtools.restart.enabled=false
community.enabled=false
