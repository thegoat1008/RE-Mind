spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME:defaultdb}?connectionTimeZone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.data-source-properties.sslMode=VERIFY_IDENTITY
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=${DB_TRUSTSTORE_URL}
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${DB_TRUSTSTORE_PASSWORD}
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false
